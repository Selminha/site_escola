# Configuração do repositório no GitHub
backend:
  name: github
  repo: SEU_USUARIO_GITHUB/NOME_DO_REPOSITORIO # Substitua pelo seu repo (ex: escola-coopep)
  branch: main

# Onde serão salvas as imagens e os PDFs do jornal
media_folder: "uploads"
public_folder: "/uploads"

# Idioma da interface em Português
locale: "pt"

collections:
  # ----------------------------------------------------
  # 1. COLEÇÃO: NOTÍCIAS & AVISOS DA COMUNIDADE
  # ----------------------------------------------------
  - name: "noticias"
    label: "Notícias & Avisos"
    label_singular: "Notícia"
    folder: "content/noticias"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "json"
    fields:
      - { label: "Título da Notícia", name: "title", widget: "string" }
      - { label: "Data de Publicação", name: "date", widget: "datetime", format: "DD/MM/YYYY", date_format: "DD/MM/YYYY", time_format: false }
      - label: "Categoria"
        name: "category"
        widget: "select"
        options: ["Vida Escolar", "Pedagógico", "Cooperativa", "Eventos"]
        default: "Vida Escolar"
      - { label: "Resumo Curto (para o card)", name: "summary", widget: "string" }
      - { label: "Texto Completo", name: "body", widget: "markdown" }

  # ----------------------------------------------------
  # 2. COLEÇÃO: JORNAL DA ESCOLA ("VOZES DA CHÁCARA")
  # ----------------------------------------------------
  - name: "jornal"
    label: "Edições do Jornal"
    label_singular: "Edição do Jornal"
    folder: "content/jornal"
    create: true
    slug: "edicao-{{numero}}"
    format: "json"
    fields:
      - { label: "Número da Edição", name: "numero", widget: "number", value_type: "int" }
      - { label: "Semestre / Ano", name: "periodo", widget: "string", default: "2026.2" }
      - { label: "Título / Tema da Edição", name: "title", widget: "string" }
      - { label: "Lema / Frase em Destaque", name: "motto", widget: "string" }
      - { label: "Reportagem Principal (Destaque da Capa)", name: "featured_article", widget: "string" }
      - { label: "Texto Completo / Artigo Principal", name: "content", widget: "markdown" }
      - { label: "Arquivo PDF Completo da Edição", name: "pdf_file", widget: "file", required: false }